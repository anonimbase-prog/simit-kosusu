name: Simit Koşusu derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web dosyalarını hazırla
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp -r assets www/assets
      - run: npm install
      - run: npx cap add android
      - name: İkon ve açılış ekranı
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#F59A3C' --splashBackgroundColor '#F59A3C'
      - run: npx cap sync android
      - name: Ekranı dikey kilitle
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i -e 's/<activity$/<activity android:screenOrientation="portrait"/' -e 's/<activity /<activity android:screenOrientation="portrait" /' "$M"
          grep -n "screenOrientation" "$M" || echo "uyarı: dikey kilit eklenemedi"
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SimitKosusu.apk
      - name: Sürüm sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Simit Koşusu sürüm ${{ github.run_number }}
          body: "Android için SimitKosusu.apk, iPhone için SimitKosusu.ipa (imzasız, Sideloadly/AltStore ile kurulur)."
          files: SimitKosusu.apk

  ios:
    name: iPhone IPA (imzasız)
    needs: android
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Web dosyalarını hazırla
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp -r assets www/assets
      - run: npm install
      - run: npx cap add ios
      - name: İkon ve açılış ekranı
        continue-on-error: true
        run: npx @capacitor/assets generate --ios
      - run: npx cap sync ios
      - name: Ekranı dikey kilitle
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$P"
      - name: IPA derle
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../SimitKosusu.ipa Payload
      - name: Sürüm sayfasına ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          files: SimitKosusu.ipa

  web:
    name: Web sürümü (GitHub Pages)
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siteyi hazırla
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp -r assets site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
